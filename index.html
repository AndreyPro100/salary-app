<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Зарплата водителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#000000; --bg-1:#0B0C10;
  --bg-glow-1:rgba(10,132,255,.32); --bg-glow-2:rgba(94,92,230,.20);
  --hero-glow-1:rgba(10,132,255,.22); --hero-glow-2:rgba(94,92,230,.06);
  --text:#F5F5F7; --text-secondary:#98989F; --text-tertiary:#65656B;
  --accent:#0A84FF; --accent-2:#64B5FF; --accent-soft:rgba(10,132,255,.18);
  --accent-fill-1:var(--accent-2); --accent-fill-2:var(--accent); --accent-text:#ffffff;
  --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.10); --glass-border:rgba(255,255,255,.12);
  --success:#32D74B; --success-soft:rgba(50,215,75,.16);
  --danger:#FF453A; --danger-soft:rgba(255,69,58,.16); --danger-text:#FF8A80;
  --nav-bg:rgba(15,15,18,.72); --chip-bg:rgba(0,0,0,.28);
  --shadow-accent:rgba(10,132,255,.45); --shadow-accent-soft:rgba(10,132,255,.35);
  --radius-lg:26px; --radius-md:18px; --radius-sm:12px;
  --font-display:'Manrope',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:'Inter',sans-serif; background:var(--bg-0); color:var(--text);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 0%, var(--bg-glow-1), transparent 55%),
    radial-gradient(circle at 100% 20%, var(--bg-glow-2), transparent 50%);
  background-attachment:fixed;
}
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

.glass{
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
}

header.top{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 10px;
}
header.top h1{
  font-family:var(--font-display); font-size:22px; font-weight:800; margin:0;
  letter-spacing:-.02em;
}
.month-switch{
  display:flex; align-items:center; gap:8px;
  background:var(--chip-bg); border:1px solid var(--glass-border);
  border-radius:999px; padding:6px 6px 6px 14px; font-size:13px; color:var(--text-secondary);
}
.month-switch button{
  background:var(--glass-strong); border:none; color:var(--text); width:26px; height:26px;
  border-radius:50%; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.month-switch span{font-weight:600; color:var(--text); min-width:92px; text-align:center;}

main{flex:1; padding:4px 20px 110px;}

.hero{
  margin-top:8px; padding:22px 20px 18px; position:relative; overflow:hidden;
  border-radius:var(--radius-lg);
}
.hero::before{
  content:""; position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(circle at 20% 0%, var(--hero-glow-1), transparent 60%),
    radial-gradient(circle at 100% 100%, var(--hero-glow-2), transparent 55%);
}
.hero .label{font-size:13px; color:var(--text-secondary); font-weight:500;}
.hero .amount{
  font-family:var(--font-display); font-weight:800; font-size:38px; letter-spacing:-.02em;
  margin:4px 0 14px;
}
.hero .chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  background:var(--chip-bg); border:1px solid var(--glass-border); border-radius:999px;
  padding:7px 12px; font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:6px;
}
.chip b{color:var(--text); font-weight:600; font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
.chip.danger{color:var(--danger-text); border-color:rgba(255,69,58,.25); background:var(--danger-soft);}
.chip.danger b{color:var(--danger-text);}

.mass-line{
  margin:14px 2px 4px; font-size:12.5px; color:var(--text-tertiary); display:flex; align-items:center; gap:6px;
}
.mass-line b{color:var(--text-secondary); font-weight:600;}
.mass-line .delta{font-weight:600;}
.mass-line .delta.up{color:var(--success);}
.mass-line .delta.down{color:var(--danger-text);}

.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin:26px 2px 12px;
}
.section-head h2{font-family:var(--font-display); font-size:17px; font-weight:700; margin:0;}
.section-head .count{color:var(--text-tertiary); font-weight:500;}

.trips{display:flex; flex-direction:column; gap:10px;}
.trip-card{
  padding:14px 16px; display:flex; flex-direction:column; gap:8px; cursor:pointer;
  transition:transform .15s ease;
}
.trip-card:active{transform:scale(.98);}
.trip-top{display:flex; align-items:center; gap:10px;}
.route-badge{
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px;
  background:var(--accent-soft); color:var(--accent-2); border-radius:8px; padding:4px 8px;
}
.trip-city{font-weight:600; font-size:14.5px; flex:1;}
.trip-date{font-size:12px; color:var(--text-tertiary);}
.trip-bottom{display:flex; align-items:center; justify-content:space-between;}
.trip-meta{font-size:12.5px; color:var(--text-secondary); font-family:'IBM Plex Mono',monospace;}
.trip-total{font-family:var(--font-display); font-weight:700; font-size:16px;}
.trip-row-extra{display:flex; gap:8px; flex-wrap:wrap;}
.trip-actions{display:flex; gap:8px; margin-top:2px;}
.trip-actions button{
  flex:1; border:1px solid var(--glass-border); background:var(--glass-strong); color:var(--text-secondary);
  font-size:12.5px; font-weight:600; padding:8px 0; border-radius:10px; cursor:pointer;
}
.trip-actions button.del{color:var(--danger-text);}

.empty{
  text-align:center; padding:40px 20px; color:var(--text-tertiary); font-size:14px;
}

.fab{
  position:fixed; right:50%; transform:translateX(calc(240px - 72px));
  bottom:96px; z-index:30;
  width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(145deg, var(--accent-fill-1), var(--accent-fill-2));
  color:var(--accent-text); font-size:28px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 30px var(--shadow-accent), 0 2px 8px var(--shadow-accent-soft);
}
@media (max-width:480px){
  .fab{right:20px; transform:none;}
}

nav.bottom{
  position:fixed; bottom:0; left:0; right:0; z-index:25;
  display:flex; justify-content:center;
}
nav.bottom .inner{
  width:100%; max-width:480px; display:flex;
  background:var(--nav-bg); backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--glass-border);
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
}
nav.bottom a{
  flex:1; text-align:center; font-size:11px; color:var(--text-tertiary); text-decoration:none;
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0;
}
nav.bottom a.active{color:var(--accent-2);}
nav.bottom a .ic{font-size:19px;}

.sheet-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.sheet-backdrop.open{display:flex;}
.sheet{
  width:100%; max-width:480px; background:var(--bg-1); border-radius:26px 26px 0 0;
  border:1px solid var(--glass-border); border-bottom:none;
  padding:14px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
}
.sheet .handle{width:40px; height:4px; background:var(--glass-strong); border-radius:4px; margin:0 auto 14px;}
.sheet h3{font-family:var(--font-display); font-size:19px; margin:0 0 16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:6px; font-weight:500;}
.field select, .field input{
  width:100%; background:var(--chip-bg); border:1px solid var(--glass-border); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:15px; font-family:inherit;
}
.field select:focus, .field input:focus{outline:none; border-color:var(--accent);}
.toggle-row{display:flex; gap:8px;}
.toggle-row button{
  flex:1; padding:11px 0; border-radius:12px; border:1px solid var(--glass-border);
  background:var(--chip-bg); color:var(--text-secondary); font-weight:600; font-size:14px; cursor:pointer;
}
.toggle-row button.active{
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2);
}
.breakdown{
  margin-top:4px; padding:14px 16px; border-radius:var(--radius-md);
  background:var(--chip-bg); border:1px solid var(--glass-border);
}
.breakdown .row{display:flex; justify-content:space-between; font-size:13.5px; color:var(--text-secondary); padding:5px 0;}
.breakdown .row b{color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:600;}
.breakdown .row.total{border-top:1px solid var(--glass-border); margin-top:6px; padding-top:10px; font-size:15px;}
.breakdown .row.total b{color:var(--accent-2); font-size:18px;}
.save-btn{
  width:100%; margin-top:16px; padding:15px 0; border:none; border-radius:16px;
  background:linear-gradient(145deg, var(--accent-fill-1), var(--accent-fill-2)); color:var(--accent-text);
  font-weight:700; font-size:16px; cursor:pointer;
  box-shadow:0 8px 24px var(--shadow-accent-soft);
}
.cancel-link{
  display:block; text-align:center; margin-top:10px; color:var(--text-tertiary); font-size:13.5px;
  background:none; border:none; cursor:pointer; width:100%; padding:6px 0;
}
.toast{
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
  background:var(--glass-strong); backdrop-filter:blur(20px); border:1px solid var(--glass-border);
  color:var(--text); padding:10px 18px; border-radius:999px; font-size:13.5px; z-index:60;
  transition:opacity .25s ease, transform .25s ease; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <h1>Рейсы</h1>
    <div class="month-switch">
      <button id="prevMonth">‹</button>
      <span id="monthLabel">—</span>
      <button id="nextMonth">›</button>
    </div>
  </header>

  <main>
    <div class="hero glass">
      <div class="label">К выплате</div>
      <div class="amount" id="heroAmount">0,00 ₽</div>
      <div class="chips">
        <div class="chip">Топливо <b id="chipFuel">0 ₽</b></div>
        <div class="chip danger">Вычерки <b id="chipDed">0 ₽</b></div>
      </div>
    </div>

    <div class="mass-line" id="massLine"></div>

    <div class="section-head">
      <h2>Рейсы <span class="count" id="tripCount">· 0</span></h2>
    </div>

    <div class="trips" id="tripsList"></div>
  </main>

  <button class="fab" id="fabAdd">+</button>

  <nav class="bottom">
    <div class="inner">
      <a href="#" class="active"><span class="ic">🚚</span>Рейсы</a>
      <a href="#"><span class="ic">🗺️</span>Маршруты</a>
      <a href="#"><span class="ic">✂️</span>Вычерки</a>
      <a href="#"><span class="ic">👥</span>Контакты</a>
    </div>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="handle"></div>
      <h3 id="sheetTitle">Новый рейс</h3>

      <div class="field">
        <label>Дата</label>
        <input type="date" id="fDate">
      </div>

      <div class="field">
        <label>Маршрут</label>
        <select id="fRoute"></select>
      </div>

      <div class="field">
        <label>Топливо</label>
        <div class="toggle-row">
          <button type="button" data-fuel="petrol" id="fuelPetrol">Бензин</button>
          <button type="button" data-fuel="diesel" id="fuelDiesel">Дизель</button>
        </div>
      </div>

      <div class="field">
        <label>Режим ввода</label>
        <div class="toggle-row">
          <button type="button" data-mode="mass" id="modeMass">По массе</button>
          <button type="button" data-mode="packages" id="modePackages">По упаковкам</button>
        </div>
      </div>

      <div class="field" id="massField">
        <label>Масса, кг</label>
        <input type="number" id="fMass" min="0" step="1" inputmode="numeric">
      </div>
      <div class="field" id="packagesField" style="display:none">
        <label>Упаковок</label>
        <input type="number" id="fPackages" min="0" step="1" inputmode="numeric">
      </div>

      <div class="field">
        <label>Вычерк, ₽ (если есть)</label>
        <input type="number" id="fDeduction" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>

      <div class="field">
        <label>Комментарий (необязательно)</label>
        <input type="text" id="fComment" placeholder="Напр. причина вычерка">
      </div>

      <div class="breakdown">
        <div class="row"><span>Упаковки</span><b id="bPackages">0</b></div>
        <div class="row"><span>Оплата за упаковки</span><b id="bPayment">0,00 ₽</b></div>
        <div class="row"><span>Топливная надбавка</span><b id="bFuel">0,00 ₽</b></div>
        <div class="row total"><span>Итого за рейс</span><b id="bTotal">0,00 ₽</b></div>
      </div>

      <button class="save-btn" id="saveTrip">Сохранить рейс</button>
      <button class="cancel-link" id="cancelSheet">Отмена</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ===================== Data: routes (admin-managed, static for now) ===================== */
const ROUTES = [
  { id:"r600", number:"№600", city:"Наб. Челны", tariff:60.5, fuel:{petrol:530.72, diesel:610.15} },
  { id:"r604", number:"№604", city:"Наб. Челны", tariff:58.0, fuel:{petrol:480.00, diesel:552.00} },
  { id:"r648", number:"№648", city:"Нижнекамск", tariff:63.2, fuel:{petrol:610.40, diesel:702.00} },
  { id:"r377", number:"№377", city:"Альметьевск", tariff:65.0, fuel:{petrol:690.00, diesel:793.50} },
  { id:"r212", number:"№212", city:"Елабуга", tariff:59.5, fuel:{petrol:505.00, diesel:580.00} },
];

/* ===================== Storage ===================== */
const STORAGE_KEY = "driverAppTrips_v1";

function loadTrips(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveTrips(trips){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); }catch(e){}
}

let trips = loadTrips();
let editingId = null;
let currentFuel = "petrol";
let currentMode = "mass";

/* ===================== Month state ===================== */
const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth(); // 0-based

const MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

function monthKey(y,m){ return y + "-" + String(m+1).padStart(2,"0"); }
function tripsInMonth(y,m){
  return trips.filter(t=>{
    const d = new Date(t.date);
    return d.getFullYear()===y && d.getMonth()===m;
  });
}

/* ===================== Formatting ===================== */
function fmt(n){
  return (n||0).toLocaleString("ru-RU",{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtInt(n){
  return Math.round(n||0).toLocaleString("ru-RU");
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("ru-RU",{day:"2-digit", month:"2-digit"});
}

/* ===================== Calculation ===================== */
function calc({routeId, fuel, mass, packages, mode}){
  const route = ROUTES.find(r=>r.id===routeId) || ROUTES[0];
  let pkgs, m;
  if(mode==="packages"){
    pkgs = Math.max(0, Math.floor(packages||0));
    m = pkgs*12;
  }else{
    m = Math.max(0, Math.floor(mass||0));
    pkgs = Math.floor(m/12);
  }
  const payment = pkgs * route.tariff;
  const fuelSurcharge = route.fuel[fuel] || 0;
  const total = payment + fuelSurcharge;
  return { route, mass:m, packages:pkgs, payment, fuelSurcharge, total };
}

/* ===================== Rendering ===================== */
function renderMonthLabel(){
  document.getElementById("monthLabel").textContent = MONTH_NAMES[viewMonth] + " " + viewYear;
}

function renderRouteOptions(){
  const sel = document.getElementById("fRoute");
  sel.innerHTML = ROUTES.map(r=>`<option value="${r.id}">${r.number} · ${r.city}</option>`).join("");
}

function renderMain(){
  const monthTrips = tripsInMonth(viewYear, viewMonth).sort((a,b)=> new Date(b.date)-new Date(a.date));

  const totalPay = monthTrips.reduce((s,t)=>s+t.payment,0);
  const totalFuel = monthTrips.reduce((s,t)=>s+t.fuelSurcharge,0);
  const totalDed = monthTrips.reduce((s,t)=>s+(t.deduction||0),0);
  const totalMass = monthTrips.reduce((s,t)=>s+t.mass,0);
  const toPay = totalPay + totalFuel - totalDed;

  document.getElementById("heroAmount").textContent = fmt(toPay) + " ₽";
  document.getElementById("chipFuel").textContent = fmt(totalFuel) + " ₽";
  document.getElementById("chipDed").textContent = (totalDed>0 ? "−" : "") + fmt(totalDed) + " ₽";
  document.getElementById("tripCount").textContent = "· " + monthTrips.length;

  // mass vs previous month
  let prevY = viewYear, prevM = viewMonth-1;
  if(prevM<0){ prevM=11; prevY--; }
  const prevMass = tripsInMonth(prevY, prevM).reduce((s,t)=>s+t.mass,0);
  const massLine = document.getElementById("massLine");
  if(prevMass>0){
    const diff = totalMass - prevMass;
    const pct = (diff/prevMass*100);
    const sign = diff>=0 ? "+" : "";
    const cls = diff>=0 ? "up" : "down";
    const arrow = diff>=0 ? "▲" : "▼";
    massLine.innerHTML = `Масса за месяц <b>${fmtInt(totalMass)} кг</b> <span class="delta ${cls}">${arrow} ${sign}${pct.toFixed(1)}% к пред. месяцу</span>`;
  }else{
    massLine.innerHTML = `Масса за месяц <b>${fmtInt(totalMass)} кг</b>`;
  }

  // trip list
  const list = document.getElementById("tripsList");
  if(monthTrips.length===0){
    list.innerHTML = `<div class="empty">Пока нет рейсов в этом месяце.<br>Нажмите «+», чтобы добавить первый.</div>`;
  }else{
    list.innerHTML = monthTrips.map(t=>{
      const route = ROUTES.find(r=>r.id===t.routeId);
      const dedChip = t.deduction>0 ? `<div class="chip danger">Вычерк <b>−${fmtInt(t.deduction)} ₽</b></div>` : "";
      return `
      <div class="trip-card glass" data-id="${t.id}">
        <div class="trip-top">
          <span class="route-badge">${route?route.number:"?"}</span>
          <span class="trip-city">${route?route.city:""}</span>
          <span class="trip-date">${fmtDate(t.date)}</span>
        </div>
        <div class="trip-bottom">
          <span class="trip-meta">${fmtInt(t.mass)} кг · ${t.packages} уп.</span>
          <span class="trip-total">${fmt(t.total - (t.deduction||0))} ₽</span>
        </div>
        ${dedChip ? `<div class="trip-row-extra">${dedChip}</div>` : ""}
        <div class="trip-actions">
          <button class="edit" data-act="edit" data-id="${t.id}">Изменить</button>
          <button class="del" data-act="del" data-id="${t.id}">Удалить</button>
        </div>
      </div>`;
    }).join("");
  }
}

/* ===================== Sheet (add/edit) logic ===================== */
const sheetBackdrop = document.getElementById("sheetBackdrop");

function setFuel(fuel){
  currentFuel = fuel;
  document.getElementById("fuelPetrol").classList.toggle("active", fuel==="petrol");
  document.getElementById("fuelDiesel").classList.toggle("active", fuel==="diesel");
  updateBreakdown();
}
function setMode(mode){
  currentMode = mode;
  document.getElementById("modeMass").classList.toggle("active", mode==="mass");
  document.getElementById("modePackages").classList.toggle("active", mode==="packages");
  document.getElementById("massField").style.display = mode==="mass" ? "" : "none";
  document.getElementById("packagesField").style.display = mode==="packages" ? "" : "none";
  updateBreakdown();
}

function updateBreakdown(){
  const routeId = document.getElementById("fRoute").value;
  const mass = parseFloat(document.getElementById("fMass").value)||0;
  const packages = parseFloat(document.getElementById("fPackages").value)||0;
  const r = calc({routeId, fuel:currentFuel, mass, packages, mode:currentMode});
  document.getElementById("bPackages").textContent = r.packages;
  document.getElementById("bPayment").textContent = fmt(r.payment) + " ₽";
  document.getElementById("bFuel").textContent = fmt(r.fuelSurcharge) + " ₽";
  document.getElementById("bTotal").textContent = fmt(r.total) + " ₽";
}

function openSheet(trip){
  editingId = trip ? trip.id : null;
  document.getElementById("sheetTitle").textContent = trip ? "Изменить рейс" : "Новый рейс";
  document.getElementById("fDate").value = trip ? trip.date : new Date().toISOString().slice(0,10);
  document.getElementById("fRoute").value = trip ? trip.routeId : ROUTES[0].id;
  document.getElementById("fDeduction").value = trip && trip.deduction ? trip.deduction : "";
  document.getElementById("fComment").value = trip && trip.comment ? trip.comment : "";
  setMode("mass");
  document.getElementById("fMass").value = trip ? trip.mass : "";
  document.getElementById("fPackages").value = trip ? trip.packages : "";
  setFuel(trip ? trip.fuel : "petrol");
  updateBreakdown();
  sheetBackdrop.classList.add("open");
}
function closeSheet(){
  sheetBackdrop.classList.remove("open");
  editingId = null;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ===================== Event wiring ===================== */
document.getElementById("fabAdd").addEventListener("click", ()=>openSheet(null));
document.getElementById("cancelSheet").addEventListener("click", closeSheet);
sheetBackdrop.addEventListener("click", (e)=>{ if(e.target===sheetBackdrop) closeSheet(); });

document.getElementById("fuelPetrol").addEventListener("click", ()=>setFuel("petrol"));
document.getElementById("fuelDiesel").addEventListener("click", ()=>setFuel("diesel"));
document.getElementById("modeMass").addEventListener("click", ()=>setMode("mass"));
document.getElementById("modePackages").addEventListener("click", ()=>setMode("packages"));
document.getElementById("fRoute").addEventListener("change", updateBreakdown);
document.getElementById("fMass").addEventListener("input", updateBreakdown);
document.getElementById("fPackages").addEventListener("input", updateBreakdown);

document.getElementById("saveTrip").addEventListener("click", ()=>{
  const date = document.getElementById("fDate").value;
  if(!date){ showToast("Укажите дату"); return; }
  const routeId = document.getElementById("fRoute").value;
  const mass = parseFloat(document.getElementById("fMass").value)||0;
  const packages = parseFloat(document.getElementById("fPackages").value)||0;
  const deduction = parseFloat(document.getElementById("fDeduction").value)||0;
  const comment = document.getElementById("fComment").value.trim();

  const r = calc({routeId, fuel:currentFuel, mass, packages, mode:currentMode});
  if(r.packages<=0){ showToast("Укажите массу или упаковки"); return; }

  if(editingId){
    const idx = trips.findIndex(t=>t.id===editingId);
    if(idx>-1){
      trips[idx] = {
        ...trips[idx], date, routeId, fuel:currentFuel,
        mass:r.mass, packages:r.packages, payment:r.payment, fuelSurcharge:r.fuelSurcharge,
        total:r.total, deduction, comment
      };
    }
    showToast("Рейс обновлён");
  }else{
    trips.push({
      id: "t" + Date.now() + Math.random().toString(36).slice(2,7),
      date, routeId, fuel:currentFuel,
      mass:r.mass, packages:r.packages, payment:r.payment, fuelSurcharge:r.fuelSurcharge,
      total:r.total, deduction, comment
    });
    showToast("Рейс добавлен");
  }
  saveTrips(trips);
  closeSheet();
  renderMain();
});

document.getElementById("tripsList").addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-act]");
  if(btn){
    const id = btn.dataset.id;
    if(btn.dataset.act==="edit"){
      const trip = trips.find(t=>t.id===id);
      if(trip) openSheet(trip);
    }else if(btn.dataset.act==="del"){
      if(confirm("Удалить этот рейс?")){
        trips = trips.filter(t=>t.id!==id);
        saveTrips(trips);
        renderMain();
        showToast("Рейс удалён");
      }
    }
    return;
  }
});

document.getElementById("prevMonth").addEventListener("click", ()=>{
  viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; }
  renderMonthLabel(); renderMain();
});
document.getElementById("nextMonth").addEventListener("click", ()=>{
  viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; }
  renderMonthLabel(); renderMain();
});

/* ===================== Init ===================== */
renderRouteOptions();
renderMonthLabel();
renderMain();
</script>
</body>
</html>
